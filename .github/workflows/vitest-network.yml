name: Vitest (network)

# 外部サービス(Mojang・PaperMC・Forge等)に実際にアクセスする`network`タグのテストを実行する
# - PR: 変更が外部サービスとの連携を壊していないかを確認する
# - 定期実行: PRが無い期間でも，外部APIの仕様変更などで修正が必要になったことを検知する
# 一時的な通信失敗はテスト単位の再試行(vitest.config.jsの`network`タグの設定)で吸収するため，
# 再試行しても失敗する場合は外部APIの仕様変更などを疑うこと (test/readme.md 参照)
on:
  pull_request:
  schedule:
    # 毎週月曜 9:00 (JST)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  vitest-network:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        # pushは行わないため，認証情報をチェックアウト先に残さない
        with:
          persist-credentials: false
      - name: 'Install Bun'
        uses: oven-sh/setup-bun@v2
        with:
            bun-version-file: package.json
      - name: 'Install Deps'
        run: bun install
      - name: 'Execute Test'
        run: bun run test:network
