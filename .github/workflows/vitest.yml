name: Vitest

on: [pull_request]
jobs:
  vitest:
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read

    steps:
      - uses: actions/checkout@v7
        # pushは行わないため，認証情報をチェックアウト先に残さない
        with:
          persist-credentials: false
      - name: 'Install Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 'Install Deps'
        run: bun install
      # 外部サービスにアクセスする`network`タグのテストは除外し，外部への通信を遮断して実行する
      # (外部サービスの状態に結果が左右されないため，このジョブの失敗はコードの問題とみなせる)
      # `network`タグのテストは vitest-network.yml で実行する
      # カバレッジは`network`タグのテスト分と合算するため，blobレポート(Vitestの既定の出力先 .vitest/blob)にも出力する．
      # (`--reporter`を指定すると既定のレポーターが無効になるため，default・github-actionsも明示する)
      - name: 'Execute Test'
        run: bun run test:offline --coverage --passWithNoTests --reporter=default --reporter=github-actions --reporter=blob
        env:
          VITEST_BLOB_LABEL: offline
      # upload-artifactは既定でドットから始まるディレクトリを除外するため，include-hidden-filesを指定する
      - name: 'Upload Test Report'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-report-offline
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  vitest-network:
    uses: ./.github/workflows/vitest-network.yml
    # 呼び出し先のワークフローにはソースの読み取り権限のみを渡す
    permissions:
      contents: read

  # 上記2ジョブのカバレッジを合算してPRにコメントする
  # (`network`タグのテストでしか通らない処理もカバレッジに含めるため．
  #  外部サービスの障害で`vitest-network`が失敗した場合も，取得できた分で合算する)
  coverage-report:
    needs: [vitest, vitest-network]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 'Install Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 'Install Deps'
        run: bun install
      # 各ジョブのblobレポートを，`--merge-reports`が既定で読み込む .vitest/blob にまとめて配置する
      - name: 'Download Test Reports'
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-report-*
          path: .vitest/blob/
          merge-multiple: true
      # テストの成否は各ジョブで判定済みのため，テスト失敗による終了コードは無視してカバレッジのみを利用する．
      # (blobが1つも無い等で合算自体に失敗した場合は，原因が埋もれないよう警告として表示する)
      - name: 'Merge Coverage'
        run: bunx vitest --merge-reports --coverage --reporter=dot || echo "::warning::テスト失敗またはblobレポートの合算失敗のため，終了コードが0以外でした(ログを確認してください)"
      - name: Coverage Report
        if: ${{ hashFiles('coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
