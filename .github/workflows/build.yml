name: Build

# secrets.GITHUB_TOKENにリポジトリへの書き込みを許可
permissions:
  contents: write
  pull-requests: write

# 同時起動とキャンセルを不可に
concurrency:
  group: 'build'
  cancel-in-progress: false

# github上の操作で起動
on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Select release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # バージョンの更新とコミットの処理
  create-commit:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.jsonのversionを次のバージョンに更新
      - uses: Server-Starter-for-Minecraft/VersionUpdater@v1
        id: get_version
        with:
          update-type: ${{inputs.type}}

      # git config
      - name: git config
        run: |
          git config --local user.name github-actions[bot]
          git config --local user.email 41898282+github-actions[bot]@users.noreply.github.com

      # リリースブランチの存在確認
      # https://dev.classmethod.jp/articles/github-actions-check-if-specific-branch-is-existing/
      - name: check release branch exists
        run: |
          branch_exists=$(
            git fetch origin release/v${{steps.get_version.outputs.next-version}} &&
            echo true ||
            echo false
          )
          echo "BRANCH_EXISTS=${branch_exists}" >> $GITHUB_ENV

      # git commit [リリースブランチがない場合]
      - name: git add & git commit
        if: env.BRANCH_EXISTS == 'false'
        run: |
          git add .
          git commit -m "🔖 Release ${{ steps.get_version.outputs.next-version }}"

      # mainに対してpullRequestを作成 [リリースブランチがない場合]
      # PRの承認とマージは、本文のチェックリストに沿って動作確認を行った後に手動で行う
      - name: Create Pull Request
        if: env.BRANCH_EXISTS == 'false'
        id: pullrequest
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 🔖 Release ${{ steps.get_version.outputs.next-version }}
          title: 🔖 Release ${{ steps.get_version.outputs.next-version }}
          body: |
            🔖 Release ${{ steps.get_version.outputs.next-version }}

            ## リリース前の動作確認

            更新前ビルドから Draft Release の新版（v${{ steps.get_version.outputs.next-version }}）へ、自動アップデートできることを確認する。
            更新前ビルドは、リリースする内容（main）をバージョン番号だけ v${{ steps.get_version.outputs.current-version }} のままビルドしたもので、[ビルドの実行結果](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) の Artifacts（`ServerStarter-v${{ steps.get_version.outputs.current-version }}-*`）からダウンロードする。
            ビルドスクリプトを再実行した場合は、このPRにコメントされる最新の実行結果を使う。

            ### 手順（各OS共通）

            1. 更新前ビルドをインストールする
            2. 環境変数 `SERVERSTARTER_MODE=debug` と `SERVERSTARTER_TOKEN=<Draft Releaseを参照できるPAT>` を設定して、ターミナルから起動する
               - Windows (PowerShell): `$env:SERVERSTARTER_MODE='debug'; $env:SERVERSTARTER_TOKEN='<PAT>'; & '<インストール先>\ServerStarter2.exe'`
               - Mac: `SERVERSTARTER_MODE=debug SERVERSTARTER_TOKEN=<PAT> /Applications/ServerStarter2.app/Contents/MacOS/ServerStarter2`
            3. 新版のインストーラーが起動し、更新後の ServerStarter2 が新版として起動することを確認する

            ### 確認結果

            - [ ] Windows (x64)：`-win`
            - [ ] Mac (Apple Silicon)：`-mac-silicon`
            - [ ] Mac (Intel)：`-mac-intel`
            - [ ] Mac (Apple Silicon 上で Intel 版を Rosetta 経由で起動)：`-mac-intel` → Apple Silicon 版に更新されること

            ### 公開中のバージョンからの確認

            更新前ビルドは main からビルドしたものなので、アップデーターの実装が公開中のバージョンと異なる場合がある。
            アップデーターに変更があったリリースでは、[公開中の最新版](${{ github.server_url }}/${{ github.repository }}/releases/latest) のインストーラーでも同じ手順で確認する。

            - [ ] Windows (x64)
            - [ ] Mac

            すべて確認できたら、このPRを main にマージし、Draft Release を公開する。
            問題があった場合は、修正を main に取り込んでからビルドスクリプトを再実行する（このブランチと Draft Release が更新される）。
          branch: 'release/v${{ steps.get_version.outputs.next-version }}'
          base: main
          labels: release
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # リリースブランチにmainをマージ [リリースブランチがある場合]
      - name: Merge Main to Release Branch
        if: env.BRANCH_EXISTS == 'true'
        # 先にget_versionの変更を取り消す
        run: |
          git checkout -- .
          git clean -f
          git checkout release/v${{ steps.get_version.outputs.next-version }}
          git merge origin/main
          git push

      # 動作確認に使う最新のビルドの実行結果をPRに通知 [リリースブランチがある場合]
      - name: Comment on Pull Request
        if: env.BRANCH_EXISTS == 'true'
        run: |
          gh pr comment 'release/v${{ steps.get_version.outputs.next-version }}' --body \
            'ビルドスクリプトを再実行しています。[この実行結果](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) が成功したら、その Artifacts を使って動作確認してください。'

    outputs:
      current-version: ${{steps.get_version.outputs.current-version }}
      next-version: ${{steps.get_version.outputs.next-version }}
      branch-name: release/v${{ steps.get_version.outputs.next-version }}

  # 各osでelectronをビルド
  build-electron:
    needs: create-commit

    defaults:
      run:
        shell: bash

    # 各osで並列ビルド
    # new-ver=true : リリースする新版（リリースブランチ）
    # new-ver=false: アップデートの動作確認に使う更新前ビルド（実行したブランチを、更新前のバージョン番号のままビルドしたもの）
    # 1つのランナーの失敗で、他のビルド（動作確認用の更新前ビルドを含む）を中断しない
    strategy:
      fail-fast: false
      matrix:
        target:
          # exts: electron-builderが出力するインストーラーの拡張子
          # suffix: アセット名でアーキテクチャを区別するための接尾辞
          #   アセット名は `ServerStarter-v<バージョン><suffix>.<拡張子>` とし、
          #   アップデーターが探すアセット名（src-electron/updater/fetch.ts の ASSET_SUFFIX）と一致させること
          - os: windows-latest
            name: win
            exts: msi
            suffix: ''
          - os: ubuntu-latest
            name: linux
            exts: deb rpm
            suffix: ''
          # macOSはネイティブモジュール（sharp / @ngrok）を含むため、アーキテクチャごとのランナーでビルドする
          # 接尾辞を -intel / -silicon とする理由は fetch.ts の ASSET_SUFFIX を参照
          # NOTE: Intelランナー（macos-15-intel）は2027年8月に廃止予定のため、それまでにarm64ランナー上でのx64ビルドへ移行する
          - os: macos-latest
            name: mac-silicon
            exts: pkg
            suffix: '-silicon'
          - os: macos-15-intel
            name: mac-intel
            exts: pkg
            suffix: '-intel'
        new-ver: [true, false]

    runs-on: ${{ matrix.target.os }}

    env:
      VERSION: ${{ matrix.new-ver && needs.create-commit.outputs.next-version || needs.create-commit.outputs.current-version }}

    steps:
      - uses: actions/checkout@v4

      # releaseブランチをチェックアウト
      - name: Checkout release branch
        if: matrix.new-ver == true
        run: |
          git fetch origin ${{ needs.create-commit.outputs.branch-name }}
          git checkout ${{ needs.create-commit.outputs.branch-name }}

      # Bunを使用
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # create-commitで行った更新をpullし、ビルドを実行
      - name: Pull and Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull
          bun install
          bun run build

      # ビルドしたインストーラーをアセット名に変更
      - name: Rename Installers
        run: |
          mkdir -p dist/release
          for ext in ${{ matrix.target.exts }}; do
            cp "dist/electron/Packaged/ServerStarter.build.${ext}" \
              "dist/release/ServerStarter-v${VERSION}${{ matrix.target.suffix }}.${ext}"
          done
          ls -la dist/release

      # 新版のビルドデータをArtifactとして一時保存（Draft Releaseへアップロードする）
      - name: Upload Artifact (Release)
        if: matrix.new-ver == true
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target.name }}
          path: dist/release/*
          retention-days: 1

      # 更新前ビルドのデータをArtifactとして保存（アップデートの動作確認用。Draft Releaseには含めない）
      - name: Upload Artifact (Current Version)
        if: matrix.new-ver == false
        uses: actions/upload-artifact@v7
        with:
          name: ServerStarter-v${{ env.VERSION }}-${{ matrix.target.name }}
          path: dist/release/*
          retention-days: 14

  # リリースを作成
  create-release:
    needs:
      - create-commit
      - build-electron

    runs-on: ubuntu-latest

    outputs:
      id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      # リリースとリリースノートを作成
      - name: Create a Release and Release note
        id: create_release
        uses: release-drafter/release-drafter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ needs.create-commit.outputs.next-version }}
          version: v${{ needs.create-commit.outputs.next-version }}
          commitish: ${{ needs.create-commit.outputs.branch-name }}
          publish: false # draft状態で作成
          prerelease: false

  # 新版のビルドデータをDraft Releaseにアップロード
  upload-build:
    needs:
      - create-commit
      - create-release
    runs-on: ubuntu-latest

    steps:
      # 一時保存した全OSのアーティファクトをダウンロード
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      # v2.2.0以前のアップデーターは、リリース内で最初に見つかった .pkg をインストールする。
      # v2.2.0のmacOS版はIntel版のため、Intel版の .pkg を先にアップロードする
      # （GitHubは現状アセットを名前順に返すが、順序は保証されていないため、アップロード順でもIntel版を先頭にしておく）
      - name: Separate Intel Installer
        run: |
          mkdir -p release-intel
          mv release/*-intel.pkg release-intel/

      # リリースにビルドデータをアップロード（アセット名はファイル名のまま）
      - name: Upload Release Assets (Intel)
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release-intel/*
          overwrite: true

      - name: Upload Release Assets (Others)
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: release/*
          overwrite: true

      # 旧アップデーターが選ぶ最初の .pkg がIntel版になっていることを確認する（並び順はGitHubが決める）
      - name: Check Asset Order for Legacy Updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          EXPECTED: ServerStarter-v${{ needs.create-commit.outputs.next-version }}-intel.pkg
        run: |
          first=$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
            --jq '[.assets[].name | select(endswith(".pkg"))][0]')
          echo "first .pkg asset: ${first}"
          if [ "${first}" != "${EXPECTED}" ]; then
            echo "::error::v2.2.0以前のアップデーターが ${EXPECTED} ではなく ${first} を選んでしまいます。アセット名を見直してください"
            exit 1
          fi

  # Discordに通知
  notify:
    needs:
      - create-commit
      - upload-build

    runs-on: ubuntu-latest

    # 失敗した場合も通知する
    if: always()

    steps:
      # ワークフローが失敗したかどうかを調べる
      - uses: technote-space/workflow-conclusion-action@v1

      # discordに通知
      - name: notify via discord
        uses: sarisia/actions-status-discord@v1
        with:
          title: Draft Release v${{ needs.create-commit.outputs.next-version }}
          description: |
            Click [here](https://github.com/${{ github.repository }}/releases) to open releases!
          url: 'https://github.com/${{ github.repository }}/releases'
          nocontext: true
          username: GitHub Actions
          webhook: ${{ secrets.DISCORD_WEBHOOK_BUILD }}
          status: ${{ env.WORKFLOW_CONCLUSION }}
